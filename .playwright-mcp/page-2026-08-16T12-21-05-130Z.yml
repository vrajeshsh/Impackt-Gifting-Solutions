  - main [ref=f3e38]:
    - generic [ref=f3e39]:
      - generic [ref=f3e41]:
        - paragraph [ref=f3e42]: Our Story
        - heading "A Legacy of Excellence" [level=1] [ref=f3e43]
        - paragraph [ref=f3e44]: From kitchenware to premium gifting — six decades of trust, now reimagined for modern India.
      - generic [ref=f3e46]:
        - generic [ref=f3e47]:
          - img "Our story" [ref=f3e49]
          - generic [ref=f3e50]:
            - paragraph [ref=f3e51]: Welcome to Impackt Gifting Solutions (IGS), where we bring the art of gifting to a whole new level. Founded in 2023 by Rushabh Shah, IGS is built upon a legacy of excellence and innovation in the SS Kitchenware business, which has been thriving for the past 60 years.
            - paragraph [ref=f3e52]: Our journey began in the heart of Kolkata, where our family business became synonymous with quality kitchenware. Over six decades, we built trust with thousands of households and businesses across India. In 2023, we channeled that same trust and taste into gifting — creating Impackt Gifting Solutions.
            - paragraph [ref=f3e53]: We believe gifting is not just about products. It is about emotions, relationships, and the stories we tell through thoughtful gestures. Whether it is a birthday, a festival, a corporate milestone, or a simple thank you, we curate gifts that resonate.
            - paragraph [ref=f3e54]: Today, Impackt Gifting Solutions stands at the intersection of tradition and modernity. We combine our deep understanding of Indian gifting culture with contemporary design, premium quality, and personalized touches that make every gift extraordinary.
            - paragraph [ref=f3e55]: "Our mission is simple: to make every occasion memorable with gifts that truly make an impression."
        - generic [ref=f3e56]:
          - paragraph [ref=f3e57]: Our Journey
